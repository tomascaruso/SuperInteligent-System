# Blueprint de Render para la demo pública (Render + Neon, plan gratis).
# Requisitos previos (no están en este archivo, se crean a mano):
#   1. Repositorio remoto en GitHub/GitLab/Bitbucket con esta rama.
#   2. Proyecto Neon (plan gratis) y su DATABASE_URL.
# Render inyecta PORT automáticamente; la app lo lee de entorno.
# JWT_SECRET se genera en el dashboard de Render (no va en el repo).
# DATABASE_URL se pega en el dashboard (sync: false = no vive en el repo).
# Nota plan gratis: el servicio duerme a los 15 min sin tráfico y tarda
# ~1 min en despertar; el disco es efímero, por eso los datos viven en
# Neon (Postgres) y no en SQLite.
services:
  - type: web
    name: superinteligent-system-demo
    env: node
    plan: free
    buildCommand: cd app && npm install && npm run build
    startCommand: cd app && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      # C7: en producción el arranque exige JWT_SECRET real (fail-fast) y
      # la cookie de sesión sale con Secure. Sin esto, Render correría el
      # servidor como desarrollo.
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      # C8: secreto del operador de PENSIA (crea invitaciones de alta).
      # Se carga a mano en el dashboard; sin él, la creación de
      # invitaciones está cerrada (la demo sembrada sigue funcionando).
      - key: OPERATOR_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      # F3-DEMO: envío del formulario de contacto por relay HTTPS (Apps
      # Script; la red gratuita de Render bloquea la salida SMTP). Se
      # cargan a mano en el dashboard; sin ellos, el formulario no se
      # muestra y el envío responde 503. La URL y el token nunca van en
      # el código ni en la página: solo en estas variables.
      - key: CONTACT_RELAY_URL
        sync: false
      - key: CONTACT_RELAY_TOKEN
        sync: false
